<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>序列检测器 | FSM检测特定位序列</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#f1f1f1;border-radius:4px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
        .card-hover{transition:all 0.2s ease}.card-hover:hover{transform:translateY(-2px);box-shadow:0 12px 20px -12px rgba(0,0,0,0.15)}
        .bit-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;font-weight:bold;font-size:1.1rem;cursor:pointer;transition:all 0.12s ease;border:2px solid #e2e8f0}
        .bit-btn.on{background:#3b82f6;color:white;border-color:#3b82f6}.bit-btn.off{background:white;color:#64748b;border-color:#e2e8f0}.bit-btn:active{transform:scale(0.92)}
        .state-node{display:flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:12px;border:2px solid;font-weight:bold;font-size:0.75rem;text-align:center;transition:all 0.2s;min-width:60px}
        .state-active{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8;transform:scale(1.05)}.state-inactive{border-color:#e2e8f0;background:white;color:#94a3b8}
        .seq-bit{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;font-weight:bold;font-size:0.85rem;margin:0 2px}
        .seq-match{background:#d1fae5;color:#065f46;border:2px solid #10b981}.seq-nomatch{background:#f1f5f9;color:#94a3b8;border:2px solid #e2e8f0}
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800 font-sans">
<div class="max-w-7xl mx-auto px-4 py-6 md:py-8">
    <div class="flex justify-start mb-4">
        <a href="../index.html" class="inline-flex items-center gap-1 text-sm font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 hover:text-blue-800 transition-colors duration-200 rounded-full px-4 py-2 shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>返回主页</a>
    </div>
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold bg-gradient-to-r from-indigo-600 to-blue-600 bg-clip-text text-transparent mb-2">序列检测器</h1>
        <p class="text-slate-600 max-w-2xl mx-auto">FSM检测串行输入中的特定位序列 | 重叠/非重叠模式</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-slate-200 p-5 card-hover">
                <h3 class="text-lg font-bold text-slate-700 flex items-center gap-2 mb-4"><span class="w-1 h-6 bg-blue-500 rounded-full"></span>目标序列</h3>
                <div class="flex justify-center gap-2 mb-3" id="targetBits"></div>
                <div class="flex justify-center gap-2">
                    <button class="bit-btn text-sm" style="width:36px;height:36px" data-idx="0" id="t0">1</button>
                    <button class="bit-btn text-sm" style="width:36px;height:36px" data-idx="1" id="t1">0</button>
                    <button class="bit-btn text-sm" style="width:36px;height:36px" data-idx="2" id="t2">1</button>
                    <button class="bit-btn text-sm" style="width:36px;height:36px" data-idx="3" id="t3">1</button>
                </div>
                <p class="text-xs text-slate-400 mt-2 text-center">点击切换每位</p>
            </div>
            <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-slate-200 p-5 card-hover">
                <h3 class="text-md font-bold text-slate-700 mb-3 flex items-center gap-2"><span class="w-1 h-5 bg-emerald-500 rounded-full"></span>输入 X</h3>
                <div class="flex justify-center"><div id="xBtn" class="bit-btn off">0</div></div>
                <p class="text-xs text-slate-400 mt-2 text-center">每次时钟边沿前切换</p>
            </div>
            <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-slate-200 p-5">
                <h3 class="text-md font-bold text-slate-700 mb-3 flex items-center gap-2"><span class="w-1 h-5 bg-amber-500 rounded-full"></span>检测结果</h3>
                <div class="text-center">
                    <div id="detectDisplay" class="text-2xl font-bold text-slate-400">未检测到</div>
                    <div id="matchCount" class="text-sm text-slate-500 mt-1">匹配次数: 0</div>
                </div>
            </div>
            <button id="clkBtn" class="w-full rounded-lg px-4 py-3 text-lg font-bold bg-blue-500 text-white hover:bg-blue-600 transition-colors">⟳ 时钟</button>
        </div>
        <div class="lg:col-span-8 space-y-5">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-4">
                <div class="text-sm font-medium text-slate-700 mb-3 px-2">序列检测时序</div>
                <div class="relative"><canvas id="timingChart" width="800" height="350" style="width:100%;height:auto;max-height:380px;"></canvas></div>
            </div>
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-5">
                <h3 class="text-md font-bold text-slate-700 mb-3">输入流与匹配</h3>
                <div id="streamDisplay" class="flex flex-wrap gap-1 justify-center"></div>
            </div>
        </div>
    </div>
</div>
<script>
    let target=[1,0,1,1],x=0,state=0,matchCount=0,timingChart=null;
    const history=[];
    const stream=[];
    function resetMachine(){state=0;matchCount=0;history.length=0;stream.length=0;}
    function clockPulse(){
        stream.push(x);
        if(stream.length>32)stream.shift();
        // Check if current state matches target prefix
        // Simple approach: track how many target bits matched so far
        if(x===target[state]){state++;if(state===target.length){matchCount++;state=0;history.push({x,detected:1});}else{history.push({x,detected:0});}}
        else{
            // Reset and check if current bit starts a new match
            state=0;
            if(x===target[0])state=1;
            history.push({x,detected:0});
        }
        if(history.length>20)history.shift();
        refreshAll();
    }
    function initTiming(){
        if(timingChart)return;
        timingChart=new Chart(document.getElementById('timingChart').getContext('2d'),{
            type:'line',data:{datasets:[]},options:{responsive:true,maintainAspectRatio:true,animation:false,interaction:{mode:'index',intersect:false},
                plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'时钟周期',font:{weight:'bold'}}},y:{min:-1,max:6,ticks:{callback(v){const m={0:'检测脉冲',2:'状态',4:'X'};return m[v]||null;},stepSize:1},grid:{color:'#eef2ff'}}},elements:{point:{radius:0}}}
        });
    }
    function updateTiming(){
        initTiming();
        if(history.length===0){timingChart.data.datasets=[];timingChart.update('none');return;}
        const tt=history.map((_,i)=>i);
        timingChart.data.datasets=[
            {label:'X',data:history.map((h,i)=>({x:i,y:h.x+4})),borderColor:'#3b82f6',borderWidth:2,stepped:'before',pointRadius:0,tension:0,backgroundColor:'transparent'},
            {label:'State',data:history.map((h,i)=>({x:i,y:(history[i].x===target[history[i].x]?1:0)+2})),borderColor:'#10b981',borderWidth:2,stepped:'before',pointRadius:0,tension:0,backgroundColor:'transparent'},
            {label:'Detected',data:history.map((h,i)=>({x:i,y:h.detected})),borderColor:'#ef4444',borderWidth:3,stepped:'before',pointRadius:0,tension:0,backgroundColor:'transparent'}
        ];
        timingChart.update('none');
    }
    function refreshAll(){
        document.getElementById('xBtn').className='bit-btn '+(x?'on':'off');document.getElementById('xBtn').textContent=x;
        ['t0','t1','t2','t3'].forEach((id,i)=>{
            const btn=document.getElementById(id);
            btn.className='bit-btn text-sm '+(target[i]?'on':'off');
            btn.style.width='36px';btn.style.height='36px';
            btn.textContent=target[i];
        });
        document.getElementById('detectDisplay').textContent=matchCount>0?'检测到! ('+matchCount+'次)':'未检测到';
        document.getElementById('detectDisplay').className='text-2xl font-bold '+(matchCount>0?'text-emerald-600':'text-slate-400');
        document.getElementById('matchCount').textContent='匹配次数: '+matchCount;
        updateTiming();
        // Stream display
        const sd=document.getElementById('streamDisplay');sd.innerHTML='';
        const targetStr=target.join('');
        for(let i=0;i<stream.length;i++){
            const div=document.createElement('div');
            div.className='seq-bit seq-nomatch';
            div.textContent=stream[i];
            // Highlight if this starts a match
            if(i+target.length<=stream.length){
                const sub=stream.slice(i,i+target.length).join('');
                if(sub===targetStr)div.className='seq-bit seq-match';
            }
            sd.appendChild(div);
        }
    }
    ['t0','t1','t2','t3'].forEach((id,i)=>{
        document.getElementById(id).addEventListener('click',()=>{target[i]=target[i]?0:1;resetMachine();refreshAll();});
    });
    document.getElementById('xBtn').addEventListener('click',()=>{x=x?0:1;refreshAll();});
    document.getElementById('clkBtn').addEventListener('click',clockPulse);
    initTiming();refreshAll();
    document.addEventListener('DOMContentLoaded',()=>{if(typeof renderMathInElement!=='undefined')renderMathInElement(document.body,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});});
    window.addEventListener('resize',()=>{if(timingChart){timingChart.resize();timingChart.update();}});
    console.log('序列检测器已启动 | 可自定义目标序列');
</script>
</body>
</html>
